name: Node.js CI Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js 18.x
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
    - name: Install Dependencies
      run: npm install
    - name: Run ESLint
      run: npm run lint
    - name: Run Jest Unit Tests
      run: npm test
